name: Windows regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-windows-py310.txt
      - name: Install the validated dependency versions
        run: python -m pip install -r requirements-dev.txt -c constraints-windows-py310.txt
      - name: Check package dependency consistency
        run: python -m pip check
      - name: Check release dependencies
        run: python -m sayink_build.dependency_check
      - name: Run regression tests
        run: python -m pytest -p no:cacheprovider tests -q
