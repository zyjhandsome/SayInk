# Static gate for CI (see .github/workflows/tests.yml). Deliberately small:
# only rules that are clean today, so the gate blocks new mistakes without a
# suppression list. Widen the selection as the tree is cleaned up.
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist", "sayink_build/*.spec", "*.spec"]

[lint]
select = [
    "E9",     # syntax / io errors
    "F",      # pyflakes: undefined names, unused imports and variables, f-strings
    "W6",     # deprecated syntax
    "B",      # flake8-bugbear: mutable defaults, unused loop vars, zip(strict=), etc.
    "C90",    # mccabe cyclomatic complexity ceiling
    "PT",     # flake8-pytest-style hygiene
    "PLE",    # pylint errors
    "PLW1510",# subprocess.run without explicit check=
    "PIE807", # prefer list/dict over lambda: []
    "PIE808", # unnecessary start=0 in range
    "PIE810", # multiple startswith/endswith
    "RUF012", # mutable class default without ClassVar
    "RUF100", # unused noqa directive
    "SIM115", # open() without context manager
]
ignore = [
    "PT006",  # existing tuple/csv parametrize argnames style
    "PT011",  # existing broad pytest.raises without match
    "PT018",  # existing compound assertions in integration tests
    "PT019",  # existing _unused autouse/fixture parameter convention
    "PT022",  # existing yield-only fixtures
    "PT028",  # existing helper functions with default args in test modules
]

[lint.mccabe]
max-complexity = 30

[lint.per-file-ignores]
# Legacy complex state/audio/parser hotspots pre-existing above 30; keep new code <= 30.
"sayink/audio_recorder.py" = ["C901"]      # _drain_mixed_mono (31)
"sayink/meeting_store.py" = ["C901"]       # _cleanup_owned_meeting_audio (34)
"sayink/output_pipeline.py" = ["C901"]     # handle_paste_result (33)
"sayink/speaker_clustering.py" = ["C901"]  # reassign_turns (41)
"sayink/speaker_turns.py" = ["C901"]       # _analyze (35)
"sayink/text_paster.py" = ["C901"]         # paste_async (34)
"sayink/transcript_import.py" = ["C901"]   # _parse_json_transcript (47)
