# Static gate for CI (see .github/workflows/tests.yml). Deliberately small:
# only rules that are clean today, so the gate blocks new mistakes without a
# suppression list. Widen the selection as the tree is cleaned up.
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist", "sayink_build/*.spec", "*.spec"]

[lint]
select = [
    "E9",     # syntax / io errors
    "F",      # pyflakes: undefined names, unused imports and variables, f-strings
    "W6",     # deprecated syntax
    "B",      # flake8-bugbear: mutable defaults, unused loop vars, zip(strict=), etc.
    "PLE",    # pylint errors
    "PLW1510",# subprocess.run without explicit check=
    "PIE807", # prefer list/dict over lambda: []
    "PIE808", # unnecessary start=0 in range
    "PIE810", # multiple startswith/endswith
    "RUF012", # mutable class default without ClassVar
    "RUF100", # unused noqa directive
    "SIM115", # open() without context manager
]
